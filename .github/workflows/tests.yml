# One workflow, two jobs, because the repo is now two deployable applications
# with nothing in common at build time. They run in parallel: neither one's
# checks need the other's artefacts, and a failure should name which half broke
# rather than leaving someone to read a combined log.
name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      # Pint, PHPStan and the 85 feature tests. The tests cover the API's
      # payload contract — see HomePageTest's key-set assertion, which is what
      # catches a field added to the controller and not to the front end's
      # HomePayload type.
      - name: Setup application
        run: composer setup

      - name: Run checks
        run: composer ci:check

  frontend:
    name: frontend (site)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Format, lint, then types. The build is last and is the one that would
      # catch an unresolved import, which neither the linter nor tsc sees.
      - name: Check formatting and lint
        run: pnpm run check

      - name: Check types
        run: pnpm run types:check

      - name: Build
        run: pnpm run build
